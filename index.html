<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SealBox encrypts files in your browser for a recipient's public key and lets them decrypt with their private key."
    />
    <title>SealBox — Encrypted File Transfer</title>
    <script>
      ;(function () {
        try {
          var preferences = JSON.parse(localStorage.getItem('sealbox.preferences.v1') || '{}')
          var theme = preferences && preferences.theme
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.dataset.theme = theme
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

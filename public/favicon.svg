      <path d="M14.5 17.2h3L18.4 24h-4.8z" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#cut)" stroke-linejoin="round" stroke-width="1.6">
    <path d="M16 3.8L26.6 9.9L16 16L5.4 9.9Z" fill="#7DB4FF" stroke="#7DB4FF"/>
    <path d="M5.4 9.9L16 16V28.2L5.4 22.1Z" fill="#3B82F6" stroke="#3B82F6"/>

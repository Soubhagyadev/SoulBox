<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="SealBox" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="#fff"/>
      <!-- seams between the three faces -->
      <g stroke="#000" stroke-width="1.1" stroke-linecap="round" fill="none">
        <path d="M16 16L5.2 9.8M16 16L26.8 9.8M16 16V29"/>
